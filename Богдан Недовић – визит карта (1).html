<!DOCTYPE html><html lang="sr-Cyrl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Богдан Недовић – визит карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700&display=swap">
<style>:root{--bg:#0A1220;--ink:#fff;--mute:rgba(255,255,255,.72);--surface:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--acc:#C9A96A;--on-acc:#0A1220;--hover:rgba(255,255,255,.18);color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--ink:#fff;--mute:rgba(255,255,255,.72);--surface:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--acc:#C9A96A;--on-acc:#0A1220;--hover:rgba(255,255,255,.18);color-scheme:dark}}:root[data-theme="dark"]{--bg:#0A1220;--ink:#fff;--mute:rgba(255,255,255,.72);--surface:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--acc:#C9A96A;--on-acc:#0A1220;--hover:rgba(255,255,255,.18);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto}
h1{margin:0;font-weight:300;letter-spacing:-.03em;line-height:1}
.role{margin:16px 0 0;color:var(--mute);font-size:17px;font-weight:500}
nav{display:flex;flex-direction:column;gap:12px}
nav a{display:flex;align-items:center;gap:14px;min-height:62px;padding:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:500;transition:background .2s,border-color .2s}
nav a svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a span{margin-left:auto;color:var(--mute);font-size:14px;font-weight:500;text-align:right;overflow-wrap:anywhere}
nav a:hover,nav a:active{background:var(--hover);border-color:var(--acc)}
nav a.main{background:var(--acc);border-color:var(--acc);color:var(--on-acc);min-height:68px}
nav a.main span{color:var(--on-acc);opacity:.75}
nav a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

main{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px 28px;isolation:isolate;overflow:hidden}
.bg{position:absolute;inset:0 0 auto 0;height:78%;z-index:-1;transition:transform .7s cubic-bezier(.22,1,.36,1);will-change:transform}
main.open .bg{transform:translateY(calc(-1*var(--shift,0px)))}
.bg img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 8%;animation:settle 1.8s cubic-bezier(.22,1,.36,1) both}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,18,32,0) 0%,rgba(10,18,32,.15) 35%,rgba(10,18,32,.8) 72%,#0A1220 100%)}
@keyframes settle{from{transform:scale(1.07);opacity:0}to{transform:none;opacity:1}}
.id{padding:0 4px 22px}
h1,.role,nav a{animation:in .9s cubic-bezier(.22,1,.36,1) var(--d,0s) backwards}
h1{--d:.15s;font-size:clamp(42px,13.5vw,58px);font-weight:300}
.role{--d:.3s;margin-top:14px;color:var(--acc);font-size:19px;font-weight:500;letter-spacing:.01em}
.role::before{content:"";display:block;width:36px;height:2px;background:var(--acc);margin-bottom:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
nav a:nth-child(1){--d:.45s}nav a:nth-child(2){--d:.55s}nav a:nth-child(3){--d:.65s}nav a:nth-child(4){--d:.75s}
nav a{flex-direction:column;justify-content:center;gap:10px;min-height:88px;padding:14px 8px;font-size:15px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .3s cubic-bezier(.22,1,.36,1),background .3s,border-color .3s}
nav a:hover{transform:translateY(-2px)}
nav a:active{transform:scale(.97)}
nav a.main{grid-column:1/-1;flex-direction:row;gap:14px;min-height:68px;padding:0 20px;font-size:17px;text-align:left;backdrop-filter:none}
.cw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s cubic-bezier(.22,1,.36,1),margin-top .7s cubic-bezier(.22,1,.36,1)}
main.open .cw{grid-template-rows:1fr;margin-top:12px}
.cw>div{min-height:0;overflow:hidden}
.copy{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px;font-weight:500;overflow-wrap:anywhere;opacity:0;transform:translateY(10px);transition:opacity .5s ease .12s,transform .7s cubic-bezier(.22,1,.36,1)}
main.open .copy{opacity:1;transform:none}
.copy button{flex:none;background:var(--acc);color:var(--on-acc);border:0;border-radius:10px;padding:10px 14px;font:500 14px Manrope,sans-serif;cursor:pointer;transition:transform .2s}
.copy button:active{transform:scale(.96)}
